<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Salenys preview form registry</title></head><body>
<!-- Netlify-only: Forms must be enabled in Netlify dashboard and tested via Forms → Submissions. -->
<form name="salenys-order-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="salenys-order-request"><input name="bot-field"><input name="province"><input name="name"><input name="city"><input name="telephone"></form>
<form name="salenys-business-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="salenys-business-enquiry"><input name="bot-field"><input name="business_type"><input name="name"><input name="company"><input name="country"><input name="city"><input name="email"><input name="telephone"><textarea name="message"></textarea></form>
<form name="salenys-general-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="salenys-general-enquiry"><input name="bot-field"><input name="name"><input name="email"><textarea name="message"></textarea></form>
<form name="salenys-suggestion" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="salenys-suggestion"><input name="bot-field"><input name="establishment_type"><input name="establishment_name"><input name="city"></form>
</body></html>
